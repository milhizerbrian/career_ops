name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RESUME_PDF_EXPORT: "0"
      RESUME_PAGE_VALIDATION: "0"
      CAREER_OPS_HEALTH_NON_SECRET: "1"
      CAREER_OPS_DISABLE_LM_STUDIO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run health
      - run: npm test
      - name: Syntax check
        run: |
          find . -maxdepth 1 -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find lib test scripts public/js -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check
